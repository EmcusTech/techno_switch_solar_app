name: techno_switch_solar_app
description: "Techno Switch Panel Configurator App" 
publish_to: 'none'  
 
version: 0.0.50+1

environment:
  sdk: ^3.7.2
 
dependencies:
  flutter:
    sdk: flutter
 
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.5
  intl: ^0.19.0
  usb_serial: ^0.5.2
  permission_handler: ^11.3.1
  convert: ^3.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  crypto: ^3.0.6
  lottie: ^2.7.0
  flutter_logs: ^2.2.1
  get: ^4.6.6
  encrypt: ^5.0.3
  shared_preferences: ^2.3.2
  dio: ^5.4.0
  path_provider: ^2.1.1
  file_picker: ^8.1.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.1
  pdf: ^3.10.7
  printing: ^5.12.0
  csv: ^6.0.0
  excel: ^4.0.3
  flutter_launcher_icons: ^0.14.4
  loading_animation_widget: ^1.3.0
  dotted_border: ^3.1.0
  # flutter_blue_plus: ^1.36.8
  flutter_blue_plus:
    git:
      url: https://github.com/EmcusTech/flutter_blue_plus-1.32.8.git
  # flutter_blue_plus_windows: ^1.26.1
  dropdown_button2: ^2.3.9
  flutter_slidable: ^3.1.2
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^5.0.0
 

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

 
flutter:
 
  uses-material-design: true
 
  assets:
    - assets/svgs/
    - assets/svgs/diagnostics/
    - assets/images/
    - assets/jsons/
 
